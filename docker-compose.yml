version: "3.9"
services:
  app:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_TIMEZONE=Asia/Shanghai
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/www:/var/www/certbot:ro
